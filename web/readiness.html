<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivicOS Readiness</title><style>:root{--bg:#08110f;--p:#0d1d18;--i:#f1fbf6;--m:#9ab5a9;--l:#214138;--a:#92f1c2;--w:#ffd68e;--b:#ff9d9d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px/1.5 Inter,system-ui}main{max-width:1180px;margin:auto;padding:48px 22px}a{color:var(--a)}h1{font-size:52px;letter-spacing:-.05em;margin:10px 0}.lead{color:var(--m);font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.12em;font-size:11px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-top:1px solid var(--l)}.yes{color:var(--a)}.no{color:var(--w)}.bad{color:var(--b)}.big{font-size:34px;font-weight:900}.muted{color:var(--m)}.runtime{margin-top:12px;padding:10px;border:1px solid var(--l);border-radius:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}};</style></head><body><main><a href="/">← CivicOS</a><div class="tag" style="margin-top:30px">Release proof</div><h1>What is CivicOS ready for?</h1><p class="lead">Three separate gates prevent a green demo suite from becoming an accidental production claim.</p><div id="root"><p class="muted">Running all golden cases…</p></div></main><script>const esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function gateRows(obj){return Object.entries(obj).map(([k,v])=>`<div class="row"><span>${esc(k.replaceAll('_',' '))}</span><strong class="${v?'yes':'no'}">${v?'PASS':'OPEN'}</strong></div>`).join('')}fetch('/readiness?run_replays=true').then(r=>r.json()).then(d=>{root.innerHTML=`<div class="grid"><section class="card"><div class="tag">Master proof</div><div class="big ${d.master_proof_ready?'yes':'bad'}">${d.master_proof_ready?'READY':'NOT READY'}</div><p class="muted">${d.golden_cases.passed}/${d.golden_cases.catalog} golden cases pass · ${d.golden_cases.flagship_verticals.length} flagship verticals · ${d.golden_cases.bounded_golden_cases} bounded scenarios</p>${gateRows(d.master_proof_gates)}</section><section class="card"><div class="tag">First tester pilot</div><div class="big ${d.first_tester_pilot_ready?'yes':'bad'}">${d.first_tester_pilot_ready?'READY':'NOT READY'}</div><p class="muted">Invite-only, adult, consented and intentionally ephemeral personal evidence.</p>${gateRows(d.first_tester_pilot_gates)}<div class="runtime"><strong>Deployment runtime:</strong> <span class="${d.pilot_runtime_configured?'yes':'no'}">${d.pilot_runtime_configured?'CONFIGURED':'NEEDS PILOT ENV SECRET'}</span><br><span class="muted">Build readiness does not commit or invent an invite secret.</span></div></section><section class="card"><div class="tag">Public beta</div><div class="big ${d.public_beta_ready?'yes':'no'}">${d.public_beta_ready?'READY':'NOT YET'}</div><p class="muted">Production trust requires broader security, domain and data-provider validation.</p>${gateRows(d.public_beta_gates)}</section></div><section class="card"><div class="tag">Definitions</div><p><strong>Master proof:</strong> ${esc(d.release_definition.v1_master_proof)}</p><p><strong>First tester pilot:</strong> ${esc(d.release_definition.first_tester_pilot)}</p><p><strong>Public beta:</strong> ${esc(d.release_definition.public_beta)}</p></section>`}).catch(e=>root.innerHTML=`<p class="bad">${esc(e.message)}</p>`)</script></body></html>
