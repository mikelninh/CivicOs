name: CivicOS Watchtower
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

jobs:
  watchtower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run semantic Watchtower cycle
        run: python scripts/watchtower_cycle.py --output artifacts/watchtower-report.json
      - name: Upload inspectable Watchtower report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicos-watchtower-report
          path: artifacts/watchtower-report.json
          if-no-files-found: warn
          retention-days: 30
