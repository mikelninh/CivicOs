[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos"
version = "1.0.0rc2"
description = "Evidence-to-action infrastructure for civic questions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]
public-money = ["pmm-mcp @ git+https://github.com/mikelninh/pmm-mcp.git"]
judge = ["judge-mcp @ git+https://github.com/mikelninh/judge-mcp.git"]

[tool.setuptools.packages.find]
include = ["civicos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app:app"
